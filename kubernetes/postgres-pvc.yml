# postgres-pvc.yml - request for persistent storage. Products survive when the pod is deleted
apiVersion: v1
kind: PersistentVolumeClaim                  # which resource requests persistent storage? (three words, no spaces)
metadata:
  name: postgres-pvc        # postgres-deployment requests the storage by this exact name
  namespace: shoplist
spec:
  accessModes:
    - ReadWriteOnce                  # only one node writes at a time
  resources:
    requests: 
      storage: 0.5Gi         # how much space? one gigabyte
