# postgres-configmap.yml - init.sql, creates the table on first start
apiVersion: v1
kind: ConfigMap                  # which resource stores regular (non-secret) configuration?
metadata:
  name: postgres-init       # postgres-deployment mounts it by this exact name
  namespace: shoplist
data:
  init.sql: |                   # file name inside the container (same as in the sql/ folder)
    CREATE TABLE IF NOT EXISTS products (
    id        SERIAL PRIMARY KEY,
    name      VARCHAR(100) NOT NULL,
    price     NUMERIC(10, 2) NOT NULL,
    quantity  INTEGER NOT NULL DEFAULT 1,
    category  VARCHAR(30) NOT NULL DEFAULT 'Other',
    bought    BOOLEAN NOT NULL DEFAULT FALSE
    );