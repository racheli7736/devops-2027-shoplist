# frontend-service.yml - your turn (step 9d). Blank page
# Hint: copy stats-service.yml here. Three differences:
#
#   [ ] type: NodePort        (the door from your computer)
#   [ ] port and targetPort: 80
#   [ ] nodePort: 30080       (same indentation as port)
#
# Before apply: kubectl apply --dry-run=server -f kubernetes/frontend-service.yml


apiVersion: v1
kind: Service
metadata:
  name:    frontend  # this name is the address. nginx.conf looks for it
  namespace: shoplist
spec:
  type: NodePort
  selector:
    app:  frontend         # must match the label in stats-deployment.yml
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080