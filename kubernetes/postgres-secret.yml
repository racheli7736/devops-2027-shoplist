# postgres-secret.yml - postgres passwords
# Values are base64-encoded. How to encode: guide, step 3 (PowerShell or Git Bash)
apiVersion: v1
kind: Secret                  # which resource stores sensitive data?
metadata:
  name: postgres-secret     # postgres-deployment and backend-deployment look up this exact name
  namespace: shoplist
type: Opaque
data:
  POSTGRES_DB: "c2hvcGxpc3Q="         # shoplist, base64-encoded
  POSTGRES_USER: "c2hvcHVzZXI="       # shopuser, base64-encoded
  POSTGRES_PASSWORD: "c2hvcHBhc3M="   # shoppass, base64-encoded
